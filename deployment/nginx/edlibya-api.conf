# /etc/nginx/sites-available/edlibya-api
# EdLibya Nginx Configuration – with video streaming support
# Enable: ln -s /etc/nginx/sites-available/edlibya-api /etc/nginx/sites-enabled/
#
# NOTE: Until a real domain + SSL certificate are configured, the API is
# served directly over plain HTTP (port 80) with NO redirect, so the app
# can reach it via an IP address (e.g. http://34.175.52.55).
# Once your domain + Let's Encrypt cert are ready, uncomment the HTTPS
# block below and flip this HTTP block back to a 301 HTTPS redirect.

# HTTP – serve the app directly (no domain / SSL cert required yet)
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/edlibya-api-common.conf;
}

